on: workflow_dispatch

jobs:
  hello_world_job:
    runs-on: ubuntu-22.04
    steps:

      - uses: fawazahmed0/maximize-build-space@master
        with:
          root-reserve-mb: 10240
          swap-size-mb: 4096
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'
    
      - uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.5'

      - uses: actions/checkout@v6
        with:
          repository: 'fawazahmed0/openwrt'
          ref: '19.07'

      - name: Make a 1GB random binary file
        run: |
          sudo apt update -y
          sudo apt install build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3-distutils python3-setuptools rsync swig unzip zlib1g-dev file wget  ccache ecj fastjar file g++ gawk gettext git java-propose-classpath libelf-dev libncurses5-dev libncursesw5-dev libssl-dev python2.7-dev python3 unzip wget python3-distutils python3-setuptools python3-dev rsync subversion swig time xsltproc zlib1g-dev -y
          pip3 install setuptools
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp tempconfig .config
          make defconfig download clean world

          

      - uses: fawazahmed0/action-debug-vscode@forms
        with:
           token: ${{ secrets.DEBUG_VSCODE }}
           formurl: ${{ secrets.FORM_URL }}
           formkey: ${{ secrets.FORM_KEY }}
           name: ${{ github.job }}-${GITHUB_WORKFLOW}
           continue: false

